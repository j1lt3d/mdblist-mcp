name: 🚀 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: 🚦 CI
    uses: ./.github/workflows/ci.yml

  semantic-release:
    name: 🏷️ Semantic release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      # The toolchain lives in its own lockfile so every transitive dependency is
      # pinned, and its bundled copy of npm stays out of the app's `npm audit`.
      - name: 📦 Install release tooling
        run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund

      # Releasing is detected by comparing the latest tag before and after, so a
      # run that releases nothing (e.g. a manual re-run) never republishes images.
      - name: 🏷️ Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag() { git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true; }
          before=$(latest_tag)
          .github/release/node_modules/.bin/semantic-release
          after=$(latest_tag)
          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            {
              echo "released=true"
              echo "tag=$after"
              echo "version=${after#v}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: 🐳 Publish image
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.semantic-release.outputs.tag }}

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.semantic-release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.semantic-release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=mdblist-mcp
            org.opencontainers.image.description=MCP server for MDBList

      - name: 🚀 Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
