version: 1
labels:
  - label: 'documentation'
    title: "^docs(\\(.+\\))?!?:"
  - label: 'documentation'
    files:
      - ".*\\.md$"

  - label: 'bug'
    title: "^fix(\\(.+\\))?!?:"

  - label: 'enhancement'
    title: "^feat(\\(.+\\))?!?:"

  - label: 'ci'
    title: "^(ci|build)(\\(.+\\))?!?:"
  - label: 'ci'
    files:
      - "^\\.github/workflows/.*"
      - '^Dockerfile.*'
      - "^\\.dockerignore$"
      - "^\\.releaserc\\.json$"

  - label: 'tests'
    title: "^test(\\(.+\\))?!?:"
  - label: 'tests'
    files:
      - '^test/.*'

  - label: 'dependencies'
    title: "^chore\\(deps\\)!?:"
  - label: 'dependencies'
    files:
      - "^package(-lock)?\\.json$"
      - "^\\.nvmrc$"

  - label: 'refactor'
    title: "^refactor(\\(.+\\))?!?:"

  - label: 'breaking-change'
    title: "^[a-z]+(\\(.+\\))?!:"
